<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeNinja | Minimal Typing Test</title>
    <style>
        :root {
            --bg-color: #FFDE03; /* Vibrant Yellow */
            --text-color: #000000;
            --main-color: #00E5FF; /* Cyan */
            --accent-color: #FF00FF; /* Magenta */
            --sub-color: #ffffff;
            --border-width: 6px;
            --shadow-offset: 12px;
            --font-main: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(#000 1px, transparent 1px);
            background-size: 20px 20px;
        }

        #app {
            max-width: 1000px;
            width: 90%;
            position: relative;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4rem;
            width: 100%;
        }

        .logo {
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            background: var(--main-color);
            padding: 1rem 2rem;
            border: var(--border-width) solid #000;
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px #000;
            transform: rotate(-3deg);
            display: inline-block;
        }

        .stats {
            display: flex;
            gap: 2rem;
        }

        .stat-item {
            background: var(--accent-color);
            padding: 0.8rem 1.5rem;
            border: var(--border-width) solid #000;
            box-shadow: 6px 6px 0px #000;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 1.5rem;
            color: #fff;
            -webkit-text-stroke: 1px #000;
        }

        #typing-area {
            font-size: 2.2rem;
            line-height: 1.4;
            background: var(--sub-color);
            border: var(--border-width) solid #000;
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px #000;
            padding: 3rem;
            height: 300px;
            overflow: hidden;
            font-family: var(--font-mono);
            position: relative;
            transform: rotate(1deg);
        }

        .word {
            display: inline-block;
            margin-right: 1rem;
            margin-bottom: 0.8rem;
        }

        .char {
            position: relative;
            color: #bbb;
            transition: all 0.05s ease;
        }

        .char.correct {
            color: var(--text-color);
            font-weight: 900;
        }

        .char.incorrect {
            background: var(--accent-color);
            color: #fff;
            border: 3px solid #000;
            padding: 0 2px;
        }

        .char.current::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 100%;
            height: 8px;
            background-color: var(--main-color);
            border: 2px solid #000;
        }

        #hidden-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        #result-screen {
            display: none;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.5) rotate(-10deg); opacity: 0; }
            to { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin: 3rem 0;
        }

        .result-card {
            background: var(--main-color);
            padding: 3rem;
            border: var(--border-width) solid #000;
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px #000;
            transform: rotate(-2deg);
        }

        .result-card:nth-child(2) {
            background: var(--accent-color);
            transform: rotate(2deg);
            color: #fff;
        }

        .result-value {
            font-size: 6rem;
            font-weight: 900;
            display: block;
            line-height: 1;
        }

        .result-label {
            font-size: 1.5rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 4px;
        }

        button {
            background: #000;
            color: #fff;
            border: var(--border-width) solid #000;
            padding: 1.5rem 4rem;
            font-family: inherit;
            font-weight: 900;
            font-size: 2rem;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 10px 10px 0px var(--main-color);
            transition: all 0.1s ease;
            margin-top: 2rem;
        }

        button:hover {
            transform: translate(-4px, -4px);
            box-shadow: 14px 14px 0px var(--main-color);
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 6px 6px 0px var(--main-color);
        }

        .high-score {
            margin-top: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            background: #fff;
            display: inline-block;
            padding: 1rem 2rem;
            border: var(--border-width) solid #000;
            box-shadow: 8px 8px 0px #000;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div id="app">
        <header id="header">
            <div class="logo">TypeNinja</div>
            <div class="stats">
                <div class="stat-item">time: <span id="timer">60</span></div>
            </div>
        </header>

        <div id="test-screen">
            <div id="typing-area" tabindex="0"></div>
            <input type="text" id="hidden-input" autocomplete="off" autofocus>
        </div>

        <div id="result-screen">
            <div class="logo">Results</div>
            <div class="result-grid">
                <div class="result-card">
                    <span class="result-value" id="wpm-result">0</span>
                    <span class="result-label">wpm</span>
                </div>
                <div class="result-card">
                    <span class="result-value" id="accuracy-result">0%</span>
                    <span class="result-label">accuracy</span>
                </div>
            </div>
            <button onclick="resetTest()">Restart Test</button>
            <div class="high-score">All-time High: <span id="high-score-val">0</span> WPM</div>
        </div>
    </div>

    <script>
        const words = [
            "the", "be", "to", "of", "and", "a", "in", "that", "have", "i", "it", "for", "not", "on", "with", "he", "as", "you", "do", "at", "this", "but", "his", "by", "from", "they", "we", "say", "her", "she", "or", "an", "will", "my", "one", "all", "would", "there", "their", "what", "so", "up", "out", "if", "about", "who", "get", "which", "go", "me", "when", "make", "can", "like", "time", "no", "just", "him", "know", "take", "people", "into", "year", "your", "good", "some", "could", "them", "see", "other", "than", "then", "now", "look", "only", "come", "its", "over", "think", "also", "back", "after", "use", "two", "how", "our", "work", "first", "well", "way", "even", "new", "want", "because", "any", "these", "give", "day", "most", "us"
        ];

        let currentWordIndex = 0;
        let currentCharIndex = 0;
        let timeLeft = 60;
        let timer = null;
        let isTestRunning = false;
        let totalCharsTyped = 0;
        let correctCharsTyped = 0;

        const typingArea = document.getElementById('typing-area');
        const hiddenInput = document.getElementById('hidden-input');
        const timerDisplay = document.getElementById('timer');
        const testScreen = document.getElementById('test-screen');
        const resultScreen = document.getElementById('result-screen');
        const wpmResult = document.getElementById('wpm-result');
        const accuracyResult = document.getElementById('accuracy-result');
        const highScoreVal = document.getElementById('high-score-val');

        function initTest() {
            typingArea.innerHTML = '';
            const shuffled = [...words].sort(() => Math.random() - 0.5);
            shuffled.forEach((word, wIdx) => {
                const wordSpan = document.createElement('span');
                wordSpan.className = 'word';
                wordSpan.id = `word-${wIdx}`;
                word.split('').forEach((char, cIdx) => {
                    const charSpan = document.createElement('span');
                    charSpan.className = 'char';
                    charSpan.textContent = char;
                    wordSpan.appendChild(charSpan);
                });
                // Add space char
                const spaceSpan = document.createElement('span');
                spaceSpan.className = 'char';
                spaceSpan.textContent = ' ';
                wordSpan.appendChild(spaceSpan);
                typingArea.appendChild(wordSpan);
            });
            
            currentWordIndex = 0;
            currentCharIndex = 0;
            updateCursor();
            
            const high = localStorage.getItem('typeninja-high-score') || 0;
            highScoreVal.textContent = high;
        }

        function updateCursor() {
            document.querySelectorAll('.char.current').forEach(el => el.classList.remove('current'));
            const currentWord = document.getElementById(`word-${currentWordIndex}`);
            if (currentWord) {
                const currentChar = currentWord.children[currentCharIndex];
                if (currentChar) {
                    currentChar.classList.add('current');
                    // Scroll into view if needed
                    if (currentChar.offsetTop > typingArea.scrollTop + 100) {
                        typingArea.scrollTop = currentChar.offsetTop - 50;
                    }
                }
            }
        }

        function startTimer() {
            isTestRunning = true;
            timer = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endTest();
                }
            }, 1000);
        }

        function endTest() {
            clearInterval(timer);
            isTestRunning = false;
            testScreen.style.display = 'none';
            document.getElementById('header').style.display = 'none';
            resultScreen.style.display = 'block';

            const wpm = Math.round((correctCharsTyped / 5) / (60 / 60)); // Simplified WPM
            const accuracy = totalCharsTyped > 0 ? Math.round((correctCharsTyped / totalCharsTyped) * 100) : 0;

            wpmResult.textContent = wpm;
            accuracyResult.textContent = accuracy + '%';

            const currentHigh = localStorage.getItem('typeninja-high-score') || 0;
            if (wpm > currentHigh) {
                localStorage.setItem('typeninja-high-score', wpm);
                highScoreVal.textContent = wpm;
            }
        }

        function resetTest() {
            timeLeft = 60;
            timerDisplay.textContent = timeLeft;
            testScreen.style.display = 'block';
            document.getElementById('header').style.display = 'flex';
            resultScreen.style.display = 'none';
            totalCharsTyped = 0;
            correctCharsTyped = 0;
            typingArea.scrollTop = 0;
            initTest();
            hiddenInput.value = '';
            hiddenInput.focus();
        }

        typingArea.addEventListener('click', () => hiddenInput.focus());

        hiddenInput.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace') {
                if (!isTestRunning || (currentWordIndex === 0 && currentCharIndex === 0)) return;

                if (currentCharIndex > 0) {
                    currentCharIndex--;
                } else if (currentWordIndex > 0) {
                    currentWordIndex--;
                    const prevWordEl = document.getElementById(`word-${currentWordIndex}`);
                    currentCharIndex = prevWordEl.children.length - 1;
                }

                const currentWordEl = document.getElementById(`word-${currentWordIndex}`);
                const charEl = currentWordEl.children[currentCharIndex];
                
                if (charEl.classList.contains('correct')) {
                    correctCharsTyped--;
                }
                charEl.classList.remove('correct', 'incorrect');
                updateCursor();
            }
        });

        hiddenInput.addEventListener('input', (e) => {
            if (!isTestRunning && timeLeft === 60) {
                startTimer();
            }

            const val = e.target.value;
            const lastChar = val[val.length - 1];
            
            const currentWordEl = document.getElementById(`word-${currentWordIndex}`);
            const chars = currentWordEl.children;
            const targetChar = chars[currentCharIndex].textContent;

            totalCharsTyped++;

            if (lastChar === targetChar) {
                chars[currentCharIndex].classList.add('correct');
                correctCharsTyped++;
            } else {
                chars[currentCharIndex].classList.add('incorrect');
            }

            currentCharIndex++;
            if (currentCharIndex >= chars.length) {
                currentWordIndex++;
                currentCharIndex = 0;
            }

            updateCursor();
            e.target.value = ''; // Clear input for next char
        });

        // Prevent backspace or other keys if needed, but here we just handle input
        initTest();
    </script>
</body>
</html>
